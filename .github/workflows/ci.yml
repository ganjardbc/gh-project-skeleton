name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.decide.outputs.api }}
      frontend: ${{ steps.decide.outputs.frontend }}
      api_changed: ${{ steps.filter.outputs.api }}
      reason_api: ${{ steps.decide.outputs.reason_api }}
      global: ${{ steps.filter.outputs.global }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            shared:
              - 'packages/shared-types/**'
            frontend:
              - 'apps/admin/**'
              - 'apps/landing/**'
              - 'packages/ui/**'
              - 'packages/eslint-config/**'
              - 'eslint.config.mjs'
            global:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/**'

      - name: Decide impacted pipelines
        id: decide
        run: |
          API=false
          REASON_API="No matching changes"

          if [[ "${{ steps.filter.outputs.global }}" == 'true' ]]; then
            API=true
            REASON_API="Global/root CI files changed"
          else
            if [[ "${{ steps.filter.outputs.api }}" == 'true' ]]; then
              API=true
              REASON_API="apps/api changed"
            fi

            if [[ "${{ steps.filter.outputs.shared }}" == 'true' ]]; then
              API=true
              REASON_API="packages/shared-types changed"
            fi
          fi

          FRONTEND=false
          if [[ "${{ steps.filter.outputs.global }}" == 'true' || "${{ steps.filter.outputs.frontend }}" == 'true' || "${{ steps.filter.outputs.shared }}" == 'true' ]]; then
            FRONTEND=true
          fi

          {
            echo "api=$API"
            echo "reason_api=$REASON_API"
            echo "frontend=$FRONTEND"
          } >> "$GITHUB_OUTPUT"

  api:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared-types (impact dependency)
        run: pnpm --filter @gh-skeleton/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter gh-skeleton-api exec prisma generate

      - name: Lint API
        run: pnpm --filter gh-skeleton-api lint

      - name: Test API
        run: pnpm --filter gh-skeleton-api test

      - name: Build API
        run: pnpm --filter gh-skeleton-api build

      - name: Cache API build artifacts
        uses: actions/cache@v4
        with:
          path: apps/api/dist
          key: ${{ runner.os }}-api-dist-${{ github.sha }}

  frontend:
    name: Lint, typecheck, and test frontends
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared-types (impact dependency)
        run: pnpm --filter @gh-skeleton/shared-types build

      - name: Lint
        run: pnpm --filter gh-skeleton-app --filter @gh-skeleton/landing --filter @gh-skeleton/ui lint

      - name: Typecheck
        run: pnpm --filter gh-skeleton-app --filter @gh-skeleton/landing --filter @gh-skeleton/ui typecheck

      - name: Test
        run: pnpm --filter gh-skeleton-app --filter @gh-skeleton/ui test

  summary:
    runs-on: ubuntu-latest
    needs: [prepare, api, frontend]
    if: always()
    steps:
      - name: CI selective execution summary
        run: |
          {
            echo "## CI Selective Execution Summary"
            echo ""
            echo "| Area | Changed | Executed | Reason |"
            echo "|------|---------|----------|--------|"
            echo "| api | ${{ needs.prepare.outputs.api_changed }} | ${{ needs.prepare.outputs.api }} | ${{ needs.prepare.outputs.reason_api }} |"
            echo "| shared-types | ${{ needs.prepare.outputs.shared }} | n/a (impact rule) | Triggers api |"
            echo "| frontend | ${{ needs.prepare.outputs.frontend }} | ${{ needs.prepare.outputs.frontend }} | apps/admin, apps/landing, packages/ui |"
            echo "| global/root | ${{ needs.prepare.outputs.global }} | full CI | Triggers api and frontend |"
            echo ""
            echo "### Job results"
            echo "- api job: ${{ needs.api.result || 'skipped' }}"
            echo "- frontend job: ${{ needs.frontend.result || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
