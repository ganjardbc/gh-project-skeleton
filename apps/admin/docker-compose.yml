services:
  gh-skeleton-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gh-skeleton-admin
    ports:
      - "8910:80"
    restart: unless-stopped
    volumes:
      # Optional: Mount nginx config if you want to override it
      # - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: Mount nginx logs
      - nginx_logs:/var/log/nginx
    networks:
      - gh-skeleton-network

volumes:
  nginx_logs:

networks:
  gh-skeleton-network:
    driver: bridge