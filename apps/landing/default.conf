server {
    listen       ${PORT};
    listen  [::]:${PORT};
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Every page is a pre-rendered /<path>/index.html. Unknown paths get the generated 404 page.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page   404  /404.html;
    error_page   500 502 503 504  /50x.html;
}
